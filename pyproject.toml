[project]
name = "kbase"
version = "1.0.0"
description = "多格式文档混合检索与智能问答知识库"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "openpyxl>=3.1.5,<4",
    "pypdf>=6,<7",
    "python-docx>=1.2,<2",
    "python-multipart>=0.0.26,<1",
    "uvicorn>=0.34,<1",
    "xlrd>=2.0.2,<3",
]

[dependency-groups]
dev = ["pytest>=8.4,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
